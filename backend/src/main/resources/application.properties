# ========================
# Server Configuration
# ========================
server.port=8080
spring.application.name=grocery-admin-backend

# ========================
# Database Configuration
# ========================
spring.datasource.url=jdbc:mysql://localhost:3306/grocery_admin_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=GroceryHikariCP
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# ========================
# JPA / Hibernate
# ========================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ========================
# SQL Initialization
# ========================
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/seed.sql
spring.sql.init.continue-on-error=true

# ========================
# JWT Configuration
# ========================
app.jwt.secret=GroceryHubSuperSecretKeyForJWTTokenGeneration2024MustBeAtLeast256BitsLong!!
app.jwt.access-token-expiration=7200000
app.jwt.refresh-token-expiration=604800000

# ========================
# File Upload
# ========================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads/

# ========================
# CORS
# ========================
app.cors.allowed-origins=http://localhost:3000,http://localhost:5500,http://localhost:50153,http://127.0.0.1:5500

# ========================
# Logging
# ========================
logging.level.root=INFO
logging.level.com.groceryhub=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
