# ========================
# Server Configuration
# ========================
server.port=8080
spring.application.name=grocery-admin-backend

# ========================
# File Storage Configuration
# ========================
app.data.dir=data/

# ========================
# JWT Configuration
# ========================
app.jwt.secret=GroceryHubSuperSecretKeyForJWTTokenGeneration2024MustBeAtLeast256BitsLong!!
app.jwt.access-token-expiration=7200000
app.jwt.refresh-token-expiration=604800000

# ========================
# File Upload
# ========================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads/

# ========================
# CORS
# ========================
app.cors.allowed-origins=http://localhost:3000,http://localhost:5500,http://localhost:50153,http://127.0.0.1:5500

# ========================
# Logging
# ========================
logging.level.root=INFO
logging.level.com.groceryhub=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
